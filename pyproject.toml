[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "labview-fpga-hdl-tools"
version = "2.0.0.dev4"
description = "LabVIEW FPGA HDL Tools"
authors = [
  "Salvador Santolucito <salvador.santolucito@gmail.com>"
]
readme = "README.md"
license = "MIT"
include = [
  { path = "labview_fpga_hdl_tools/host_interfaces/**", format = "sdist" }
]

[tool.poetry.dependencies]
# Supports the Python versions in their maintenance window (3.10-3.14).
python = ">=3.10,<3.15"
mako = ">=1.3.10"
click = ">=8.1.8,<8.2"
packaging = ">=21.0"
tomli = {version = ">=1.1.0", python = "<3.11"}

[tool.poetry.group.test.dependencies]
# >=9.0.3 fixes insecure /tmp/pytest-of-{user} tmpdir handling (CVE); requires Python >=3.10.
pytest = ">=9.0.3"

[tool.poetry.group.lint.dependencies]
bandit = { version = ">=1.7", extras = ["toml"] }
ni-python-styleguide = ">=0.4.1"
# Pinned directly (transitive via ni-python-styleguide) so security updates can be applied.
black = ">=26.1.0"
# flake8-black < 0.4.0 crashes (BLK900) on black >= 25.9.0 due to a decode_bytes API change.
flake8-black = ">=0.4.0"
# Transitive via bandit/pbr and ni-python-styleguide. CVE-2025-47273 (PackageIndex.download
# path traversal) was fixed in 78.1.1. Capped < 81 because setuptools 81 removed the bundled
# pkg_resources, which flake8-import-order 0.18.x (via ni-python-styleguide 0.4.x) still imports.
setuptools = ">=78.1.1,<81"
mypy = ">=1.0"
pyright = { version = ">=1.1.400", extras = ["nodejs"] }

[tool.poetry.scripts]
nihdl = "labview_fpga_hdl_tools.__main__:main"

[tool.mypy]
packages = ["labview_fpga_hdl_tools"]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "mako.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
