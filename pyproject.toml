[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "labview-fpga-hdl-tools"
version = "2.0.0.dev8"
description = "LabVIEW FPGA HDL Tools"
authors = [
  "Salvador Santolucito <salvador.santolucito@gmail.com>"
]
readme = "README.md"
license = "MIT"
include = [
  { path = "labview_fpga_hdl_tools/host_interfaces/**", format = "sdist" }
]

[tool.poetry.dependencies]
# Supports the Python versions in their maintenance window (3.10-3.14).
python = ">=3.10,<3.15"
mako = ">=1.3.10"
click = ">=8.1.8,<8.2"
packaging = ">=21.0"
# Hardens XML parsing against XXE / entity-expansion attacks (used instead of xml.etree/minidom).
defusedxml = ">=0.7.1"
tomli = {version = ">=1.1.0", python = "<3.11"}

[tool.poetry.group.test.dependencies]
# >=9.0.3 fixes insecure /tmp/pytest-of-{user} tmpdir handling (CVE); requires Python >=3.10.
pytest = ">=9.0.3"

[tool.poetry.group.lint.dependencies]
bandit = { version = ">=1.7", extras = ["toml"] }
# 0.5.x bundles flake8-tidy-imports (bans relative imports) and a pkg_resources-free
# flake8-import-order (>=0.19.2), which is required for setuptools >= 81.
ni-python-styleguide = ">=0.5.1"
# Pinned directly (transitive via ni-python-styleguide) so security updates can be applied.
# Capped < 26 because ni-python-styleguide 0.5.x requires black < 26.0; 25.12.0 needs Python >= 3.10.
black = ">=25.12.0,<26"
# flake8-black < 0.4.0 crashes (BLK900) on black >= 25.9.0 due to a decode_bytes API change.
flake8-black = ">=0.4.0"
# Transitive via bandit/pbr and ni-python-styleguide. Bumped to the latest to clear the
# setuptools sdist Unicode-normalization advisory (fixed in 83.0.0); 83 dropped pkg_resources,
# which is why ni-python-styleguide 0.5.x (pkg_resources-free import-order) is required.
setuptools = ">=83.0.0"
mypy = ">=1.0"
pyright = { version = ">=1.1.400", extras = ["nodejs"] }

[tool.poetry.scripts]
nihdl = "labview_fpga_hdl_tools.__main__:main"

[tool.mypy]
packages = ["labview_fpga_hdl_tools"]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "mako.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "defusedxml.*"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
# Reviewed low-severity informational tests, safe by construction:
#   B404/B603/B607 - subprocess is invoked with argument lists (never shell=True), so there is
#     no shell-injection surface; executable paths are resolved from trusted configuration.
#   B405 - xml.etree is used only for XML generation / ParseError handling; all XML parsing
#     uses defusedxml (see the B314/B318 remediations).
skips = ["B404", "B603", "B607", "B405"]
