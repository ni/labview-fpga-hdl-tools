name: PR

on:
  pull_request:
    branches:
      - main
      - 'releases/**'
      - prerelease
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enforce_pr_source:
    name: Enforce PR source branch
    # Pull requests into main may only come from the prerelease branch. Promote
    # dev work through prerelease first (dev -> prerelease -> main).
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Only allow PRs into main from prerelease
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "PR from '$HEAD_REF' into '$BASE_REF'."
          if [ "$HEAD_REF" != "prerelease" ]; then
            echo "::error::Pull requests into 'main' may only come from the 'prerelease' branch (got '$HEAD_REF'). Promote your changes through 'prerelease' first (dev -> prerelease -> main)."
            exit 1
          fi
          echo "OK: PR source branch is 'prerelease'."

  run_ci:
    name: Run CI
    uses: ./.github/workflows/CI.yml
    permissions:
      contents: read
